{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <title>{% block title %}Scouts{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <link href="{% static 'scouts/styles.css' %}" rel="stylesheet">
    {% block script %}
    {% endblock %}
</head>

<body class="p-2">
    <nav class="navbar bg-light mx-2">
        <a class="nav-brand" href="{% url 'index' %}">Scouts</a>
        {% if not user.is_authenticated %}
        
        <a class="nav-brand" href="{% url 'register' %}">Register</a>
        <a class="nav-brand" href="{% url 'login' %}">Log In</a>

        {% else %}
        <a class="nav-brand" href="{% url 'logout' %}"><span style="text-decoration: none; font-weight: normal"> {{user}} ( {{user.unit}} ) </span> Log Out </a>
        {% endif %}
    </nav>

    <div class="mx-2">
        {% block body %}
        {% endblock %}
    </div>
</body>

</html>
